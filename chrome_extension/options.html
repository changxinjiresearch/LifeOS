<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextPlan Sync 设置</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}body{margin:0;background:#f5f6fa}.wrap{max-width:700px;margin:42px auto;padding:0 20px}h1{font-size:28px;margin-bottom:6px}.lead{color:#6b7280;margin-bottom:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px}label{display:block;font-weight:650;margin:12px 0 6px}input[type=text],input[type=password],input[type=number]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d5d9e2;border-radius:10px;font:inherit}.row{display:flex;gap:10px;align-items:center}.row input{flex:1}button{border:0;border-radius:10px;padding:9px 13px;font-weight:650;cursor:pointer}.primary{background:#3478f6;color:#fff}.secondary{background:#eef1f6;color:#394150}.small{font-size:12px;color:#7a8292;line-height:1.5}.ok{color:#0f9f6e}.bad{color:#d14343}.switch{display:flex;gap:10px;align-items:center;margin-top:12px}
</style></head><body><div class="wrap"><h1>NextPlan Sync</h1><div class="lead">Chrome 本地桥接。完整聊天内容不会发送到 NextPlan 后端。</div><div class="card"><label>后端地址</label><input id="endpoint" type="text"><label>浏览器 Token</label><div class="row"><input id="token" type="password" autocomplete="off"><button id="generate" class="secondary">生成</button><button id="copy" class="secondary">复制</button></div><div class="small">这个 Token 只保存在 Chrome 本机。请把同一个值设置为 Railway 的 <b>NEXTPLAN_EXTENSION_TOKEN</b>，不要发到聊天里。</div></div><div class="card"><div class="switch"><input id="autoSync" type="checkbox"><label for="autoSync" style="margin:0">高置信度变化自动同步</label></div><label>自动同步阈值</label><input id="threshold" type="number" min="70" max="99" step="1"><div class="small">建议 88–92%。低于阈值的变化只进入扩展图标里的待确认队列，不会自动写入。</div></div><div class="row"><button id="save" class="primary">保存设置</button><button id="test" class="secondary">测试连接</button><span id="result" class="small"></span></div></div><script src="options.js"></script></body></html>

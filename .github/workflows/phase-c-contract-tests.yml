name: NextPlan Phase C contract tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_server/requirements.txt pytest jsonschema
      - name: Run Phase C contract tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_phase_c.py

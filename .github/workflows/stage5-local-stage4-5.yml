name: NextPlan Local Stage 4-5 acceptance

on:
  push:
    branches: [main, 'stage5/local-v01-stage4-5']
    paths:
      - 'mcp_server/local_pairing_v1.py'
      - 'mcp_server/project_intelligence_v1.py'
      - 'mcp_server/local_classifier_v1.py'
      - 'mcp_server/local_actions_v2.py'
      - 'mcp_server/local_core_v2.py'
      - 'chrome_extension_local/**'
      - 'tests/test_local_stage4_5.py'
      - 'NEXTPLAN_LOCAL_STAGE4_5.md'
      - '.github/workflows/stage5-local-stage4-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stage4-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt pytest pytest-asyncio
      - name: Compile local bridge and conversational intelligence
        run: python -m py_compile mcp_server/local_pairing_v1.py mcp_server/project_intelligence_v1.py mcp_server/local_classifier_v1.py mcp_server/local_actions_v2.py mcp_server/local_core_v2.py
      - name: Run Stage 4-5 acceptance tests
        run: python -m pytest -q tests/test_local_stage4_5.py
      - name: Preserve Stage 1-3 regression
        run: python -m pytest -q tests/test_local_stage1_3.py
      - name: Preserve Stage IV conversational guards
        run: python -m pytest -q tests/test_conversation_capture.py
      - name: Validate local extension JavaScript
        run: |
          node --check chrome_extension_local/background.js
          node --check chrome_extension_local/content.js
          node --check chrome_extension_local/popup.js
          node --check chrome_extension_local/options.js
      - name: Validate local extension manifest and separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('chrome_extension_local/manifest.json').read_text())
          assert 'http://127.0.0.1/*' in manifest['host_permissions']
          assert not any('railway' in x.lower() for x in manifest['host_permissions'])
          background = Path('chrome_extension_local/background.js').read_text()
          assert 'http://127.0.0.1:47123' in background
          assert 'lifeos-production' not in background
          cloud = Path('chrome_extension/background_v041.js').read_text()
          assert 'lifeos-production-89ce.up.railway.app' in cloud
          print('local/cloud bridge separation PASS')
          PY
      - name: Verify paired Local Core requires no cloud credentials
        env:
          NEXTPLAN_GITHUB_TOKEN: ''
          NEXTPLAN_EXTENSION_TOKEN: ''
        run: python -c "from mcp_server.local_core_v2 import create_local_app; import tempfile, pathlib; p=pathlib.Path(tempfile.mkdtemp())/'x.db'; a=create_local_app(p); assert a.issue_pairing_code(); print('standalone paired Local Core PASS')"

name: NextPlan Phase D contract tests

on:
  push:
    branches: [main]
    paths:
      - 'mcp_server/phase_d_engine.py'
      - 'mcp_server/cloud_classifier_v5.py'
      - 'mcp_server/server_v10.py'
      - 'engine/build_state_v2.py'
      - 'engine/run_automations.py'
      - 'tests/test_phase_d.py'
      - 'state.schema.json'
      - 'event.schema.json'
      - '.github/workflows/phase-d-contract-tests.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt pytest
      - name: Run Phase D contract tests
        run: pytest -q tests/test_phase_d.py

name: NextPlan Phase A contract tests

on:
  push:
    paths:
      - 'mcp_server/**'
      - 'tests/test_phase_a.py'
      - 'NEXTPLAN_CORE_SCHEMA_V1.md'
      - 'NEXTPLAN_SYNC_COMMAND_PROTOCOL_V1.md'
      - 'NEXTPLAN_ENTITY_RESOLUTION_V1.md'
      - 'state.schema.json'
      - 'command.schema.json'
      - 'receipt.schema.json'
      - '.github/workflows/phase-a-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r mcp_server/requirements.txt
      - name: Run Phase A contract tests
        run: python -m unittest tests.test_phase_a -v

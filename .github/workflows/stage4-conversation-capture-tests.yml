name: NextPlan Stage IV conversation capture tests

on:
  push:
    branches: [main]
    paths:
      - 'mcp_server/conversation_capture.py'
      - 'mcp_server/cloud_classifier_v6.py'
      - 'mcp_server/server_v12.py'
      - 'scripts/stage4_server_v12_acceptance.py'
      - 'tests/test_conversation_capture.py'
      - 'Dockerfile'
      - 'NEXTPLAN_CONVERSATIONAL_CAPTURE_V1.md'
      - '.github/workflows/stage4-conversation-capture-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt pytest
      - name: Run conversational capture regression tests
        run: python -m pytest -q tests/test_conversation_capture.py
      - name: Compile Stage IV composition
        run: python -m py_compile mcp_server/conversation_capture.py mcp_server/cloud_classifier_v6.py mcp_server/server_v12.py scripts/stage4_server_v12_acceptance.py
      - name: Verify production composition import
        run: python -c "from mcp_server.server_v12 import app; print('server_v12 import PASS', bool(app))"
      - name: Exercise server_v12 production classifier path
        run: python scripts/stage4_server_v12_acceptance.py

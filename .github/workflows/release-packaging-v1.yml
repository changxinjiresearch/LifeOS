name: NextPlan Release Packaging v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mcp_server/**'
      - 'scripts/**'
      - 'desktop_local/**'
      - 'chrome_extension_local/**'
      - 'tests/test_release_packaging_contract.py'
      - 'tests/test_shared_ui_adapter_contract.py'
      - 'docs/RELEASE_PACKAGING_V1.md'
      - '.github/workflows/release-packaging-v1.yml'

permissions:
  contents: write

jobs:
  windows-distributable:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync canonical Web UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/sync_web_ui_to_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install -r mcp_server/requirements.txt pytest pytest-asyncio pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q tests/test_release_packaging_contract.py tests/test_shared_ui_adapter_contract.py tests/test_local_stage9_10.py tests/test_local_stage6_8.py tests/test_local_stage4_5.py tests/test_local_stage1_3.py tests/test_conversation_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check desktop_local/ui/desktop-adapter.js
          node --check desktop_local/ui/web-runtime.js
          node --check chrome_extension_local/background.js
          node --check chrome_extension_local/content.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone bundled Local Core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --clean --onefile --name nextplan-core --paths . --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on scripts/local_core_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/nextplan-core.exe')) { throw 'nextplan-core.exe missing' }
          Copy-Item 'dist/nextplan-core.exe' 'desktop_local/src-tauri/resources/nextplan-core.exe' -Force

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 icon desktop_local/src-tauri/icons/icon.png --output desktop_local/src-tauri/icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path desktop_local/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config desktop_local/src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows distributable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          $installer = Get-ChildItem 'desktop_local/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Copy-Item $installer.FullName 'release-artifacts/NextPlan-Setup-v0.1.0.exe' -Force

      - name: Zero-dependency Windows acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $core = (Resolve-Path 'dist/nextplan-core.exe').Path
          $installer = (Resolve-Path 'release-artifacts/NextPlan-Setup-v0.1.0.exe').Path
          & 'scripts/clean_machine_acceptance.ps1' -CoreExe $core -Installer $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write Windows checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'release-artifacts/NextPlan-Setup-v0.1.0.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  NextPlan-Setup-v0.1.0.exe" | Set-Content 'release-artifacts/SHA256SUMS-windows.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: NextPlan-Windows-v0.1.0
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  macos-distributable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
            expected_uname: arm64
          - runner: macos-15-intel
            arch: intel
            expected_uname: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Verify native architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.expected_uname }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync canonical Web UI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_web_ui_to_desktop.py

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r mcp_server/requirements.txt pytest pytest-asyncio pyinstaller

      - name: Verify release contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_release_packaging_contract.py tests/test_shared_ui_adapter_contract.py tests/test_local_stage9_10.py tests/test_local_stage6_8.py tests/test_local_stage4_5.py tests/test_local_stage1_3.py tests/test_conversation_capture.py
          node --check desktop_local/ui/desktop-adapter.js
          node --check desktop_local/ui/web-runtime.js
          node --check chrome_extension_local/background.js
          node --check chrome_extension_local/content.js

      - name: Build standalone bundled Local Core
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --onefile --name nextplan-core --paths . \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            scripts/local_core_entry.py
          test -x dist/nextplan-core
          cp dist/nextplan-core desktop_local/src-tauri/resources/nextplan-core
          chmod +x desktop_local/src-tauri/resources/nextplan-core

      - uses: dtolnay/rust-toolchain@stable

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @tauri-apps/cli@2 icon desktop_local/src-tauri/icons/icon.png --output desktop_local/src-tauri/icons
          cargo check --manifest-path desktop_local/src-tauri/Cargo.toml
          npx --yes @tauri-apps/cli@2 build --bundles app,dmg --config desktop_local/src-tauri/tauri.conf.json
          APP="$(find desktop_local/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG="$(find desktop_local/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP" && test -d "$APP"
          test -n "$DMG" && test -f "$DMG"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Zero-dependency macOS acceptance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/clean_macos_acceptance.sh
          scripts/clean_macos_acceptance.sh "$APP_PATH"

      - name: Prepare macOS distributable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          NAME="NextPlan-v0.1.0-macOS-${{ matrix.arch }}.dmg"
          cp "$DMG_PATH" "release-artifacts/$NAME"
          shasum -a 256 "release-artifacts/$NAME" | sed 's#release-artifacts/##' > "release-artifacts/SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NextPlan-macOS-${{ matrix.arch }}-v0.1.0
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-distributable, macos-distributable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-download
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-download/*
          generate_release_notes: true

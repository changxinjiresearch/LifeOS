name: Rename system to NextPlane

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical state name
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('state.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data.setdefault('system', {})['name'] = 'NextPlane'
          data['system']['last_updated'] = '2026-09-10T22:33:05+09:30'
          events = data.setdefault('events', [])
          event_id = 'evt-20260910-nextplane-name'
          if not any(e.get('id') == event_id for e in events):
              events.insert(0, {
                  'id': event_id,
                  'at': '2026-09-10T22:33:05+09:30',
                  'project_id': 'system',
                  'type': 'system_renamed',
                  'summary': 'Official application name changed to NextPlane.'
              })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rename system to NextPlane"
          git push

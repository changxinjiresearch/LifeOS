name: NextPlan agent external trigger poll

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextplan-agent-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install polling dependency
        run: pip install 'httpx>=0.28,<1'
      - name: Poll verified GitHub provider state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/stage3_github_poll.py
      - name: Build canonical state
        run: python engine/build_state_v3.py
      - name: Commit verified observations if changed
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain events/inbox state.json)" ]; then
            echo 'No verified external change.'
            exit 0
          fi
          git config user.name 'nextplan-agent-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events/inbox state.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'NextPlan agent observation: refresh verified GitHub signal'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done
          exit 1

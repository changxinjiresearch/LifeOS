name: NextPlan MCP smoke test

on:
  push:
    branches: [main]
    paths:
      - 'mcp_server/**'
      - 'chrome_extension/**'
      - 'Dockerfile'
      - '.github/workflows/mcp-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp_server/**'
      - 'chrome_extension/**'
      - 'Dockerfile'
      - '.github/workflows/mcp-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextplan-mcp-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt
      - name: Import and list MCP tools in-process
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client
          from mcp_server.server import mcp, app, _validate_status, _validate_date

          EXPECTED = {
              'get_state', 'search_state', 'create_project', 'create_task',
              'complete_task', 'update_milestone', 'update_project',
              'set_deadline', 'add_note', 'add_resource'
          }

          async def main():
              async with Client(mcp, raise_exceptions=True) as client:
                  page = await client.list_tools()
                  names = {t.name for t in page.tools}
                  print('TOOLS:', sorted(names))
                  assert EXPECTED <= names
                  assert app is not None

          asyncio.run(main())
          assert _validate_status('waiting') == 'waiting'
          assert _validate_date('2026-12-18') == '2026-12-18'
          PY
      - name: Compile Python
        run: python -m compileall -q mcp_server
      - name: Validate Chrome bridge files
        run: |
          python -m json.tool chrome_extension/manifest.json >/dev/null
          for f in chrome_extension/*.js; do node --check "$f"; done
      - name: Test HTTP auth guards
        env:
          NEXTPLAN_MCP_PATH_SECRET: test-secret-for-ci
          NEXTPLAN_EXTENSION_TOKEN: test-extension-token
        run: |
          uvicorn mcp_server.server:app --host 127.0.0.1 --port 8765 --no-access-log >/tmp/nextplan-uvicorn.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --max-time 2 -fsS http://127.0.0.1:8765/healthz >/tmp/health.json; then break; fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/health.json
          test "$(curl -sS -o /tmp/mcp.txt -w '%{http_code}' http://127.0.0.1:8765/mcp)" = "401"
          test "$(curl -sS -o /tmp/ext.txt -w '%{http_code}' http://127.0.0.1:8765/extension/state)" = "401"
          AUTH_EXT=$(curl -sS -o /tmp/extauth.txt -w '%{http_code}' -H 'Authorization: Bearer test-extension-token' http://127.0.0.1:8765/extension/state)
          test "$AUTH_EXT" != "401"
          test "$AUTH_EXT" != "503"
          python - <<'PY'
          import asyncio
          from mcp import Client
          EXPECTED = {
              'get_state', 'search_state', 'create_project', 'create_task',
              'complete_task', 'update_milestone', 'update_project',
              'set_deadline', 'add_note', 'add_resource'
          }
          async def main():
              async with Client('http://127.0.0.1:8765/test-secret-for-ci/mcp') as client:
                  page = await client.list_tools()
                  assert EXPECTED <= {t.name for t in page.tools}
          asyncio.run(main())
          PY
      - name: Build production Docker image
        run: docker build -t nextplan-mcp:ci .

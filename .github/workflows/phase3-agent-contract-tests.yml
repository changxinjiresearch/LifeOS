name: NextPlan Stage III contract tests

on:
  push:
    branches: [main]
    paths:
      - 'mcp_server/action_gateway_v1.py'
      - 'mcp_server/connectors_v1.py'
      - 'mcp_server/agent_stage3.py'
      - 'mcp_server/server_v11.py'
      - 'engine/build_state_v3.py'
      - 'scripts/stage3_github_e2e.py'
      - 'scripts/stage3_server_v11_acceptance.py'
      - 'tests/test_action_gateway_v1.py'
      - 'tests/test_stage3_agent_v1.py'
      - 'NEXTPLAN_AGENT_STAGE3_V1.md'
      - '.github/workflows/phase3-agent-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt pytest
      - name: Run Stage III contract tests
        run: python -m pytest -q tests/test_action_gateway_v1.py tests/test_stage3_agent_v1.py
      - name: Compile Stage III modules
        run: python -m py_compile mcp_server/action_gateway_v1.py mcp_server/connectors_v1.py mcp_server/agent_stage3.py mcp_server/server_v11.py engine/build_state_v3.py scripts/stage3_server_v11_acceptance.py
      - name: Run real GitHub connector E2E smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/stage3_github_e2e.py
      - name: Run server_v11 canonical acceptance exercise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/stage3_server_v11_acceptance.py

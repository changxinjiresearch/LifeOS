name: NextPlan Direct v3 safety

on:
  push:
    branches: [main, feature/nextplan-direct-v3]
    paths:
      - 'mcp_server/direct_v3.py'
      - 'mcp_server/direct_v3_http.py'
      - 'mcp_server/server_v14.py'
      - 'tests/test_direct_v3*.py'
      - '.github/workflows/nextplan-direct-v3.yml'
  pull_request:
    paths:
      - 'mcp_server/direct_v3.py'
      - 'mcp_server/direct_v3_http.py'
      - 'mcp_server/server_v14.py'
      - 'tests/test_direct_v3*.py'
      - '.github/workflows/nextplan-direct-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r mcp_server/requirements.txt
      - name: Syntax check
        run: python -m compileall -q mcp_server
      - name: Verify staged routing without enabling writes
        run: |
          python - <<'PY'
          import asyncio, json
          from mcp_server.server_v14 import app
          async def check(path):
              sent=[]
              async def receive():
                  return {"type":"http.request","body":b"","more_body":False}
              async def send(item):
                  sent.append(item)
              await app({"type":"http","path":path,"method":"GET","headers":[]},receive,send)
              assert sent[0]["status"]==200, (path,sent)
              return json.loads(sent[1]["body"])
          assert asyncio.run(check("/direct/v3/status"))["status"]=="disabled"
          assert asyncio.run(check("/healthz"))["status"]=="ok"
          PY
      - name: V3 isolated safety regression
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_direct_v3*.py' -v

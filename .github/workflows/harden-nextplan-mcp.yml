name: Harden NextPlan MCP deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-nextplan-mcp.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden MCP server and Docker launch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mcp_server/server.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'MCP_PATH_SECRET = os.getenv("NEXTPLAN_MCP_PATH_SECRET", "")\nGITHUB_API = "https://api.github.com"',
              'MCP_PATH_SECRET = os.getenv("NEXTPLAN_MCP_PATH_SECRET", "")\nALLOW_INSECURE = os.getenv("NEXTPLAN_ALLOW_INSECURE", "").strip().lower() in {"1", "true", "yes"}\nGITHUB_API = "https://api.github.com"'
          )

          s = s.replace(
              '        "NextPlan is the user\'s canonical cross-domain task and project state. "\n        "Use write tools only for confirmed state changes. Discussion, hypotheticals, "',
              '        "NextPlan is the user\'s canonical cross-domain task and project state. "\n        "When a conversation confirms a meaningful new task, completion, status change, deadline, note, or safe resource pointer, proactively use the appropriate NextPlan tool before finishing the reply. "\n        "Use write tools only for confirmed state changes. Discussion, hypotheticals, "'
          )

          old = '''        path = scope.get("path", "")\n        headers = {k.decode().lower(): v.decode() for k, v in scope.get("headers", [])}\n        auth = headers.get("authorization", "")'''
          new = '''        path = scope.get("path", "")\n        if path == "/healthz":\n            body = b'{"status":"ok","service":"NextPlan MCP"}'\n            await send({"type": "http.response.start", "status": 200, "headers": [(b"content-type", b"application/json"), (b"content-length", str(len(body)).encode())]})\n            await send({"type": "http.response.body", "body": body})\n            return\n        if not (MCP_BEARER_TOKEN or MCP_PATH_SECRET or ALLOW_INSECURE):\n            body = b'{"error":"server_auth_not_configured"}'\n            await send({"type": "http.response.start", "status": 503, "headers": [(b"content-type", b"application/json"), (b"content-length", str(len(body)).encode())]})\n            await send({"type": "http.response.body", "body": body})\n            return\n        headers = {k.decode().lower(): v.decode() for k, v in scope.get("headers", [])}\n        auth = headers.get("authorization", "")'''
          if old not in s:
              raise SystemExit('auth middleware anchor not found')
          s = s.replace(old, new)

          s = s.replace(
              '        if (MCP_BEARER_TOKEN or MCP_PATH_SECRET) and not (bearer_ok or path_ok):',
              '        if not ALLOW_INSECURE and (MCP_BEARER_TOKEN or MCP_PATH_SECRET) and not (bearer_ok or path_ok):'
          )

          s = s.replace(
              'mcp_app = mcp.streamable_http_app(stateless_http=True, json_response=True)',
              'mcp_app = mcp.streamable_http_app(stateless_http=True, json_response=True, host="0.0.0.0")'
          )
          p.write_text(s, encoding='utf-8')

          d = Path('Dockerfile')
          ds = d.read_text(encoding='utf-8')
          ds = ds.replace(
              'uvicorn mcp_server.server:app --host 0.0.0.0 --port ${PORT:-8000}',
              'uvicorn mcp_server.server:app --host 0.0.0.0 --port ${PORT:-8000} --no-access-log'
          )
          d.write_text(ds, encoding='utf-8')
          PY
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server/server.py Dockerfile
          git diff --cached --quiet && exit 0
          git commit -m "Harden NextPlan MCP auth and Railway runtime"
          git push

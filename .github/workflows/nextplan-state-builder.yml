name: NextPlan state builder

on:
  push:
    branches: [main]
    paths:
      - 'events/inbox/**.json'
      - 'engine/build_state.py'
      - 'engine/build_state_v2.py'
      - 'engine/build_state_v3.py'
      - 'event.schema.json'
      - '.github/workflows/nextplan-state-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextplan-state-builder
  cancel-in-progress: false

jobs:
  build-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical state from unprocessed events
        run: python3 engine/build_state_v3.py

      - name: Commit state if changed
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            echo 'No state change.'
            exit 0
          fi
          git config user.name 'nextplan-state-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git commit -m 'Build NextPlan state from conversation events'

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done
          exit 1

name: NextPlan state builder

on:
  push:
    branches: [main]
    paths:
      - 'events/inbox/**.json'
      - 'engine/build_state.py'
      - 'engine/build_state_v2.py'
      - 'engine/build_state_v3.py'
      - 'event.schema.json'
      - '.github/workflows/nextplan-state-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextplan-state-builder
  cancel-in-progress: false

jobs:
  build-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild canonical state with safe conflict recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nextplan-state-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "State build attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            python3 engine/build_state_v3.py
            if git diff --quiet -- state.json; then
              echo 'Canonical state already current.'
              exit 0
            fi
            git add state.json
            git commit -m 'Build NextPlan state from conversation events'
            if git push origin HEAD:main; then
              echo 'Canonical state published.'
              exit 0
            fi
            echo 'Concurrent write detected; rebuilding from the latest main instead of rebasing state.json.'
            sleep 2
          done
          echo 'Failed to publish canonical state after five clean retries.' >&2
          exit 1

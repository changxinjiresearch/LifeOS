name: NextPlan Local Stage 1-3 acceptance

on:
  push:
    branches:
      - main
      - 'stage5/**'
    paths:
      - 'docs/local/**'
      - 'mcp_server/local_projector.py'
      - 'mcp_server/storage_v1.py'
      - 'mcp_server/local_actions_v1.py'
      - 'mcp_server/local_core_v1.py'
      - 'scripts/migrate_lifeos_to_sqlite.py'
      - 'tests/test_local_stage1_3.py'
      - '.github/workflows/stage5-local-stage1-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stage1-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r mcp_server/requirements.txt pytest pytest-asyncio

      - name: Compile Local Stage 1-3 modules
        run: >-
          python -m py_compile
          mcp_server/local_projector.py
          mcp_server/storage_v1.py
          mcp_server/local_actions_v1.py
          mcp_server/local_core_v1.py
          scripts/migrate_lifeos_to_sqlite.py

      - name: Run Local Stage 1-3 tests
        run: python -m pytest -q tests/test_local_stage1_3.py tests/test_conversation_capture.py

      - name: Real LifeOS to SQLite migration gate
        run: |
          mkdir -p /tmp/nextplan-local
          python scripts/migrate_lifeos_to_sqlite.py --db /tmp/nextplan-local/nextplan.db

      - name: Verify cloud credentials are not required by Local Core
        env:
          NEXTPLAN_GITHUB_TOKEN: ''
          NEXTPLAN_EXTENSION_TOKEN: ''
          NEXTPLAN_LOCAL_DB: /tmp/nextplan-local/standalone.db
          NEXTPLAN_LOCAL_TOKEN: local-ci-token
        run: |
          python - <<'PY'
          from mcp_server.local_core_v1 import app
          assert app.store.get_state()['system']['canonical_store'] == 'sqlite-local'
          assert app.token == 'local-ci-token'
          print('LOCAL CORE STANDALONE PASS')
          PY

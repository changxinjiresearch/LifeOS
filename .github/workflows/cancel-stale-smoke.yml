name: Cancel stale MCP smoke run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-smoke.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale pre-timeout smoke run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST /repos/${{ github.repository }}/actions/runs/34497070744/cancel || true
